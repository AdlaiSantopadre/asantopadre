apiVersion: v1
kind: Pod
metadata:
  name: inspect-orderer3-msp
  namespace: orgx
spec:
  restartPolicy: Never
  containers:
  - name: inspect
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: msp
      mountPath: /msp
  volumes:
  - name: msp
    persistentVolumeClaim:
      claimName: orderer3-msp-pvc
