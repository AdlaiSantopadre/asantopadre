apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-orderer2
  namespace: orgdcms
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: alpine
        command: ["/bin/sh","-c"]
        args:
        - |
          cp -r /artifacts/msp/* /var/hyperledger/orderer/msp/
          cp -r /artifacts/tls/* /var/hyperledger/orderer/tls/
        volumeMounts:
        - name: msp
          mountPath: /var/hyperledger/orderer/msp
        - name: tls
          mountPath: /var/hyperledger/orderer/tls
        - name: artifacts
          mountPath: /artifacts
      volumes:
      - name: msp
        persistentVolumeClaim:
          claimName: orderer2-msp-pvc
      - name: tls
        persistentVolumeClaim:
          claimName: orderer2-tls-pvc
      - name: artifacts
        hostPath:
          path: /home/asantopadre/artifacts/orgdcms/orderer2
