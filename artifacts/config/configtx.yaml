Organizations:

  # --- Application orgs ---
  - &OrgDCMS
    Name: OrgDCMS
    ID: OrgDCMSMSP
    MSPDir: /home/asantopadre/fabric-deploy/orgdcms-msp
    Policies:
      Readers: { Type: Signature, Rule: "OR('OrgDCMSMSP.member')" }
      Writers: { Type: Signature, Rule: "OR('OrgDCMSMSP.member')" }
      Admins:  { Type: Signature, Rule: "OR('OrgDCMSMSP.admin')" }

  - &OrgX
    Name: OrgX
    ID: OrgXMSP
    MSPDir: /home/asantopadre/fabric-deploy/ca-client-orgx/msp
    Policies:
      Readers: { Type: Signature, Rule: "OR('OrgXMSP.member')" }
      Writers: { Type: Signature, Rule: "OR('OrgXMSP.member')" }
      Admins:  { Type: Signature, Rule: "OR('OrgXMSP.admin')" }

  # --- Orderer orgs ---
  - &Orderer1Org
    Name: Orderer1Org
    ID: Orderer1MSP
    MSPDir: /home/asantopadre/fabric-deploy/orderer-msps/orderer1-msp
    Policies:
      Readers: { Type: Signature, Rule: "OR('Orderer1MSP.member')" }
      Writers: { Type: Signature, Rule: "OR('Orderer1MSP.member')" }
      Admins:  { Type: Signature, Rule: "OR('Orderer1MSP.admin')" }

  - &Orderer2Org
    Name: Orderer2Org
    ID: Orderer2MSP
    MSPDir: /home/asantopadre/fabric-deploy/orderer-msps/orderer2-msp
    Policies:
      Readers: { Type: Signature, Rule: "OR('Orderer2MSP.member')" }
      Writers: { Type: Signature, Rule: "OR('Orderer2MSP.member')" }
      Admins:  { Type: Signature, Rule: "OR('Orderer2MSP.admin')" }

  - &Orderer3Org
    Name: Orderer3Org
    ID: Orderer3MSP
    MSPDir: /home/asantopadre/fabric-deploy/orderer-msps/orderer3-msp
    Policies:
      Readers: { Type: Signature, Rule: "OR('Orderer3MSP.member')" }
      Writers: { Type: Signature, Rule: "OR('Orderer3MSP.member')" }
      Admins:  { Type: Signature, Rule: "OR('Orderer3MSP.admin')" }


Orderer: &Orderer
  OrdererType: etcdraft
  Addresses:
   - orderer1-hl.orgdcms.svc.cluster.local:7050
   - orderer2-hl.orgdcms.svc.cluster.local:7050
   - orderer3-hl.orgx.svc.cluster.local:7050
  Organizations:
    - *Orderer1Org
    - *Orderer2Org
    - *Orderer3Org
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

  EtcdRaft:
    Consenters:
      - Host: orderer1-hl.orgdcms.svc.cluster.local
        Port: 7050
        ClientTLSCert: /home/asantopadre/artifacts/channel-artifacts/orderer1-tls.pem
        ServerTLSCert: /home/asantopadre/artifacts/channel-artifacts/orderer1-tls.pem
      - Host: orderer2-hl.orgdcms.svc.cluster.local
        Port: 7050
        ClientTLSCert: /home/asantopadre/artifacts/channel-artifacts/orderer2-tls.pem
        ServerTLSCert: /home/asantopadre/artifacts/channel-artifacts/orderer2-tls.pem
      - Host: orderer3-hl.orgx.svc.cluster.local
        Port: 7050
        ClientTLSCert: /home/asantopadre/artifacts/channel-artifacts/orderer3-tls.pem
        ServerTLSCert: /home/asantopadre/artifacts/channel-artifacts/orderer3-tls.pem

Profiles:
  Canale1:
    Policies:
      Readers:
        Type: ImplicitMeta
        Rule: "ANY Readers"
      Writers:
        Type: ImplicitMeta
        Rule: "ANY Writers"
      Admins:
        Type: ImplicitMeta
        Rule: "MAJORITY Admins"
    Consortium: SampleConsortium
    Application:
      Policies:
        Readers:
          Type: ImplicitMeta
          Rule: "ANY Readers"
        Writers:
          Type: ImplicitMeta
          Rule: "ANY Writers"
        Admins:
          Type: ImplicitMeta
          Rule: "MAJORITY Admins"
      Organizations:
        - *OrgDCMS
        - *OrgX
    Orderer:
      <<: *Orderer
