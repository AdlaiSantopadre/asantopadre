apiVersion: v1
kind: Pod
metadata:
  name: clean-peer1-ledger
  namespace: orgdcms
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh","-lc","rm -rf /prod/ledgersData /prod/transientStore /prod/chaincodes; echo OK; sleep 3"]
    volumeMounts:
    - name: ledger
      mountPath: /prod
  volumes:
  - name: ledger
    persistentVolumeClaim:
      claimName: peer1-orgdcms-ledger-pvc
