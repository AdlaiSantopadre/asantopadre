# /home/asantopadre/fabric-2.5/artifacts/fabric-ca-orgdcms.yaml 23/01
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fabric-ca-orgdcms-pvc
  namespace: orgdcms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: fabric-ca-orgdcms
  namespace: orgdcms
spec:
  selector:
    app: fabric-ca-orgdcms
  ports:
    - name: https
      port: 7054
      targetPort: 7054
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-ca-orgdcms
  namespace: orgdcms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-ca-orgdcms
  template:
    metadata:
      labels:
        app: fabric-ca-orgdcms
    spec:
      containers:
        - name: fabric-ca
          image: hyperledger/fabric-ca:1.5.9
          args:
            - sh
            - -c
            - fabric-ca-server start -b boot:bootpw
          env:
            - name: FABRIC_CA_HOME
              value: /etc/hyperledger/fabric-ca-server
            - name: FABRIC_CA_SERVER_CA_NAME
              value: ca-orgdcms
            - name: FABRIC_CA_SERVER_TLS_ENABLED
              value: "true"
            - name: FABRIC_CA_SERVER_CSR_CN
              value: fabric-ca-orgdcms
            - name: FABRIC_CA_SERVER_CSR_HOSTS
              value: fabric-ca-orgdcms,fabric-ca-orgdcms.orgdcms.svc,fabric-ca-orgdcms.orgdcms.svc.cluster.local,localhost
            - name: FABRIC_CA_SERVER_CFG_IDENTITIES_ALLOWREMOVE
              value: "true"
          ports:
            - containerPort: 7054
          volumeMounts:
            - name: data
              mountPath: /etc/hyperledger/fabric-ca-server
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fabric-ca-orgdcms-pvc

