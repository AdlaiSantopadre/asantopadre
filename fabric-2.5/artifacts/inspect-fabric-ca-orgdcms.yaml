apiVersion: v1
kind: Pod
metadata:
  name: inspect-fabric-ca-orgdcms
  namespace: orgdcms
spec:
  restartPolicy: Never
  containers:
    - name: inspect
      image: busybox
      command: ["sh", "-c", "sleep 1d"]
      volumeMounts:
        - name: ca-data
          mountPath: /mnt
  volumes:
    - name: ca-data
      persistentVolumeClaim:
        claimName: fabric-ca-orgdcms-pvc
