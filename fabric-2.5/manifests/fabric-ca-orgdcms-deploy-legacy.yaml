#Fabric CA deployment 18/02
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-ca-orgdcms
  namespace: orgdcms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-ca-orgdcms
  template:
    metadata:
      labels:
        app: fabric-ca-orgdcms
    spec:
      containers:
        - name: fabric-ca
          image: hyperledger/fabric-ca:1.5.9
          command: ["sh","-c"]
          args:
            - fabric-ca-server start
          ports:
            - containerPort: 7054
          env:
            - name: FABRIC_CA_HOME
              value: /etc/hyperledger/fabric-ca-server
            - name: FABRIC_CA_SERVER_TLS_ENABLED
              value: "true"
            - name: FABRIC_CA_SERVER_TLS_CERTFILE
              value: /etc/hyperledger/fabric-ca-server/tls/cert.pem
            - name: FABRIC_CA_SERVER_TLS_KEYFILE
              value: /etc/hyperledger/fabric-ca-server/tls/key.pem
          volumeMounts:
            - name: data
              mountPath: /etc/hyperledger/fabric-ca-server
            - name: tls
              mountPath: /etc/hyperledger/fabric-ca-server/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fabric-ca-orgdcms-pvc
        - name: tls
          secret:
            secretName: fabric-ca-orgdcms-tls
