# fabric-ca-orgdcms.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fabric-ca-orgdcms-pvc
  namespace: orgdcms
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fabric-ca-orgdcms-config
  namespace: orgdcms
data:
  fabric-ca-server-config.yaml: |
    # fabric-ca-server-config.yaml
    # Derivato dallo standard Fabric CA
    # Version of config file
    version: 1.5.9

    # Server's listening port (default: 7054)
    port: 7054

    cors:
      enabled: false
      origins:
        - "*"

    debug: false
    crlsizelimit: 512000

    tls:
      enabled: false
      certfile:
      keyfile:
      clientauth:
        type: noclientcert
        certfiles:

    ca:
      name: ca-orgdcms
      keyfile:
      certfile:
      chainfile:
      reenrollIgnoreCertExpiry: false

    crl:
      expiry: 24h

    registry:
      maxenrollments: -1
      identities:
        - name: admin
          pass: adminpw
          type: admin
          affiliation: orgdcms
          attrs:
            hf.Registrar.Roles: "*"
            hf.Registrar.DelegateRoles: "*"
            hf.Registrar.Attributes: "*"
            hf.GenCRL: true
            hf.Revoker: true
            hf.AffiliationMgr: true
            hf.IntermediateCA: true

    db:
      type: sqlite3
      datasource: fabric-ca-server.db
      tls:
        enabled: false
        certfiles:
        client:
          certfile:
          keyfile:

    ldap:
      enabled: false
      url: ldap://<adminDN>:<adminPassword>@<host>:<port>/<base>
      tls:
        certfiles:
        client:
          certfile:
          keyfile:
      attribute:
        names: ['uid','member']
        converters:
          - name:
            value:
        maps:
          groups:
            - name:
              value:

    affiliations:
      orgdcms:
        - department1

    signing:
      default:
        usage:
          - digital signature
        expiry: 8760h
      profiles:
        ca:
          usage:
            - cert sign
            - crl sign
          expiry: 43800h
          caconstraint:
            isca: true
            maxpathlen: 0
        tls:
          usage:
            - signing
            - key encipherment
            - server auth
            - client auth
            - key agreement
          expiry: 8760h

    csr:
      cn: ca-orgdcms
      keyrequest:
        algo: ecdsa
        size: 256
      names:
        - C: IT
          ST: Italy
          L: Urbino
          O: OrgDCMS
          OU: Fabric

    idemix:
      rhpoolsize: 1000
      nonceexpiration: 15s
      noncesweepinterval: 15m
      curve: amcl.Fp256bn

    bccsp:
      default: SW
      sw:
        hash: SHA2
        security: 256
        filekeystore:
          keystore: msp/keystore

    cacount:
    cafiles:

    intermediate:
      parentserver:
        url:
        caname:
      enrollment:
        hosts:
        profile:
        label:
      tls:
        certfiles:
        client:
          certfile:
          keyfile:

    cfg:
      identities:
        passwordattempts: 10

    operations:
      listenAddress: 127.0.0.1:9443
---
apiVersion: v1
kind: Service
metadata:
  name: fabric-ca-orgdcms
  namespace: orgdcms
spec:
  selector:
    app: fabric-ca-orgdcms
  ports:
    - name: ca
      port: 7054
      targetPort: 7054
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-ca-orgdcms
  namespace: orgdcms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-ca-orgdcms
  template:
    metadata:
      labels:
        app: fabric-ca-orgdcms
    spec:
      containers:
        - name: fabric-ca
          image: hyperledger/fabric-ca:1.5.9
          command: ["fabric-ca-server"]
          args: ["start"]
          env:
            - name: FABRIC_CA_HOME
              value: /etc/hyperledger/fabric-ca-server
          ports:
            - containerPort: 7054
          volumeMounts:
            - name: data
              mountPath: /etc/hyperledger/fabric-ca-server
            - name: config
              mountPath: /etc/hyperledger/fabric-ca-server/fabric-ca-server-config.yaml
              subPath: fabric-ca-server-config.yaml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fabric-ca-orgdcms-pvc
        - name: config
          configMap:
            name: fabric-ca-orgdcms-config

