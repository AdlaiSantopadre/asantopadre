apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orderer2-ledger-pvc
  namespace: orgdcms
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
