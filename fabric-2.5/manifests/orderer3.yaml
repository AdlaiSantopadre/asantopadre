apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orderer3-msp-pvc
  namespace: orgx
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orderer3-tls-pvc
  namespace: orgx
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orderer3-ledger-pvc
  namespace: orgx
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 5Gi
---

apiVersion: v1
kind: Service
metadata:
  name: orderer3
  namespace: orgx
spec:
  selector:
    app: orderer3
  ports:
    - name: grpc
      port: 7050
      targetPort: 7050
    - name: admin
      port: 7053
      targetPort: 7053
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderer3
  namespace: orgx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderer3
  template:
    metadata:
      labels:
        app: orderer3
    spec:
      containers:
        - name: orderer
          image: hyperledger/fabric-orderer:2.5
          ports:
            - containerPort: 7050
            - containerPort: 7053
          env:
            - name: ORDERER_GENERAL_LISTENADDRESS
              value: "0.0.0.0"
            - name: ORDERER_GENERAL_LISTENPORT
              value: "7050"
            - name: ORDERER_GENERAL_LOCALMSPID
              value: Orderer3MSP
            - name: ORDERER_GENERAL_LOCALMSPDIR
              value: /var/hyperledger/orderer/msp
            - name: ORDERER_GENERAL_BOOTSTRAPMETHOD
              value: none
            - name: ORDERER_CHANNELPARTICIPATION_ENABLED
              value: "true"

            - name: ORDERER_GENERAL_TLS_ENABLED
              value: "true"
            - name: ORDERER_GENERAL_TLS_PRIVATEKEY
              value: /var/hyperledger/orderer/tls/keystore/key.pem
            - name: ORDERER_GENERAL_TLS_CERTIFICATE
              value: /var/hyperledger/orderer/tls/signcerts/cert.pem
            - name: ORDERER_GENERAL_TLS_ROOTCAS
              value: /var/hyperledger/orderer/tls/tlscacerts/tls-ca-cert.pem

            - name: ORDERER_ADMIN_LISTENADDRESS
              value: "0.0.0.0:7053"
            - name: ORDERER_ADMIN_TLS_ENABLED
              value: "true"
            - name: ORDERER_ADMIN_TLS_PRIVATEKEY
              value: /var/hyperledger/orderer/tls/keystore/key.pem
            - name: ORDERER_ADMIN_TLS_CERTIFICATE
              value: /var/hyperledger/orderer/tls/signcerts/cert.pem
            - name: ORDERER_ADMIN_TLS_ROOTCAS
              value: /var/hyperledger/orderer/tls/tlscacerts/tls-ca-cert.pem
            - name: ORDERER_ADMIN_TLS_CLIENTROOTCAS
              value: /var/hyperledger/orderer/tls/tlscacerts/tls-ca-cert.pem

            - name: ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE
              value: /var/hyperledger/orderer/tls/signcerts/cert.pem
            - name: ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY
              value: /var/hyperledger/orderer/tls/keystore/key.pem
            - name: ORDERER_GENERAL_CLUSTER_ROOTCAS
              value: /var/hyperledger/orderer/tls/tlscacerts/tls-ca-cert.pem

          volumeMounts:
            - name: ledger
              mountPath: /var/hyperledger/production
            - name: msp
              mountPath: /var/hyperledger/orderer/msp
            - name: tls
              mountPath: /var/hyperledger/orderer/tls
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: orderer3-ledger-pvc
        - name: msp
          persistentVolumeClaim:
            claimName: orderer3-msp-pvc
        - name: tls
          persistentVolumeClaim:
            claimName: orderer3-tls-pvc
