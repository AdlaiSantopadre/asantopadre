################################################################################
#   ORGANIZATIONS
#   This section defines the organizational identities that can be referenced
#   in the configuration profiles.
################################################################################
Organizations:
  # --- Application orgs ---



  - &OrgDCMS
    Name: OrgDCMS
    ID: OrgDCMSMSP
    MSPDir: /home/asantopadre/fabric-deploy/configtx/orgdcms/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgDCMSMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrgDCMSMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrgDCMSMSP.admin')"
  # Policy di Endorement
      Endorsement:
        Type: Signature
        Rule: "OR('OrgDCMSMSP.peer')"
    AnchorPeers:
        - Host: peer1.orgdcms.svc.cluster.local
          Port: 7051


  - &OrgX
    Name: OrgX
    ID: OrgXMSP
    MSPDir: /home/asantopadre/fabric-deploy/configtx/orgx/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgXMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrgXMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrgXMSP.admin')"
  # Endorsment policy mancava
      Endorsement:
        Type: Signature
        Rule: "OR('OrgXMSP.peer')"

    AnchorPeers:
        - Host: peer2.orgx.svc.cluster.local
          Port: 7051



  # --- Orderer orgs ---

  - &Orderer1Org
    Name: Orderer1Org
    ID: Orderer1MSP
    MSPDir: /home/asantopadre/fabric-deploy/configtx/orderers/orderer1/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Orderer1MSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('Orderer1MSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('Orderer1MSP.admin')"

  - &Orderer2Org
    Name: Orderer2Org
    ID: Orderer2MSP
    MSPDir: /home/asantopadre/fabric-deploy/configtx/orderers/orderer2/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Orderer2MSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('Orderer2MSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('Orderer2MSP.admin')"

  - &Orderer3Org
    Name: Orderer3Org
    ID: Orderer3MSP
    MSPDir: /home/asantopadre/fabric-deploy/configtx/orderers/orderer3/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Orderer3MSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('Orderer3MSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('Orderer3MSP.admin')"
################################################################################
#   CAPABILITIES
################################################################################

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_0: true
################################################################################
#   ORDERER
#   This section defines the values to encode into a config transaction or
#   genesis block for orderer related parameters.
################################################################################
Orderer: &Orderer
  OrdererType: etcdraft
  Addresses:
    - orderer1.orgdcms.svc.cluster.local:7050
    - orderer2.orgdcms.svc.cluster.local:7050
    - orderer3.orgx.svc.cluster.local:7050
  Organizations:
    - *Orderer1Org
    - *Orderer2Org
    - *Orderer3Org

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities
  EtcdRaft:
    Consenters:
      - Host: orderer1.orgdcms.svc.cluster.local
        Port: 7050
        ClientTLSCert: /home/asantopadre/fabric-deploy/osnadmin/orderer1-orgdcms/tls/signcerts/cert.pem
        ServerTLSCert: /home/asantopadre/fabric-deploy/osnadmin/orderer1-orgdcms/tls/signcerts/cert.pem

      - Host: orderer2.orgdcms.svc.cluster.local
        Port: 7050
        ClientTLSCert: /home/asantopadre/fabric-deploy/osnadmin/orderer2-orgdcms/tls/signcerts/cert.pem
        ServerTLSCert: /home/asantopadre/fabric-deploy/osnadmin/orderer2-orgdcms/tls/signcerts/cert.pem

      - Host: orderer3.orgx.svc.cluster.local
        Port: 7050
        ClientTLSCert: /home/asantopadre/fabric-deploy/osnadmin/orderer3-orgx/tls/signcerts/cert.pem
        ServerTLSCert: /home/asantopadre/fabric-deploy/osnadmin/orderer3-orgx/tls/signcerts/cert.pem
################################################################################
#   APPLICATION DEFAULTS
################################################################################

Application: &ApplicationDefaults
  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities






################################################################################
#   PROFILES
#
#   Different configuration profiles may be encoded here to be specified as
#   parameters to the configtxgen tool. The profiles which specify consortiums
#   are to be used for generating the orderer genesis block. With the correct
#   consortium members defined in the orderer genesis block, channel creation
#   requests may be generated with only the org member names and a consortium
#   name.
################################################################################
Profiles:
  Canale1:
    Consortium: SampleConsortium

    Capabilities:
      <<: *ChannelCapabilities

    Policies:
      Readers:
        Type: ImplicitMeta
        Rule: "ANY Readers"
      Writers:
        Type: ImplicitMeta
        Rule: "ANY Writers"
      Admins:
        Type: ImplicitMeta
        Rule: "MAJORITY Admins"
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *OrgDCMS
        - *OrgX
    Orderer:
      <<: *Orderer
