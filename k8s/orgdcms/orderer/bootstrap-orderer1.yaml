apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-orderer1
  namespace: orgdcms
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: busybox
        command: ["sh", "-c"]
        args:
          - |
            set -e
            echo "Copy MSP"
            cp -R /artifacts/msp/* /var/hyperledger/orderer/msp/
            echo "Copy TLS"
            cp -R /artifacts/tls/* /var/hyperledger/orderer/tls/
            echo "Bootstrap completed"
        volumeMounts:
        - name: artifacts-msp
          mountPath: /artifacts/msp
          readOnly: true
        - name: artifacts-tls
          mountPath: /artifacts/tls
          readOnly: true
        - name: msp
          mountPath: /var/hyperledger/orderer/msp
        - name: tls
          mountPath: /var/hyperledger/orderer/tls
        - name: ledger
          mountPath: /var/hyperledger/orderer/production
      volumes:
      - name: artifacts-msp
        hostPath:
          path: /home/asantopadre/artifacts/orgdcms/orderer1/msp
          type: Directory
      - name: artifacts-tls
        hostPath:
          path: /home/asantopadre/artifacts/orgdcms/orderer1/tls
          type: Directory
      - name: msp
        persistentVolumeClaim:
          claimName: orderer1-msp-pvc
      - name: tls
        persistentVolumeClaim:
          claimName: orderer1-tls-pvc
      - name: ledger
        persistentVolumeClaim:
          claimName: orderer1-ledger-pvc
