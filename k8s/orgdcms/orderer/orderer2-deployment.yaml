# k8s/orgdcms/orderer/orderer2-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderer2
  namespace: orgdcms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderer2
  template:
    metadata:
      labels:
        app: orderer2
    spec:
      containers:
      - name: orderer
        image: hyperledger/fabric-orderer:2.4
        ports:
        - containerPort: 7050
        - containerPort: 7053
        env:
        - name: ORDERER_GENERAL_LISTENADDRESS
          value: "0.0.0.0"
        - name: ORDERER_GENERAL_LISTENPORT
          value: "7050"
        - name: ORDERER_GENERAL_LOCALMSPID
          value: Orderer2MSP
        - name: ORDERER_GENERAL_LOCALMSPDIR
          value: /var/hyperledger/orderer/msp
        - name: ORDERER_GENERAL_BOOTSTRAPMETHOD
          value: none
        - name: ORDERER_CHANNELPARTICIPATION_ENABLED
          value: "true"

        - name: ORDERER_GENERAL_TLS_ENABLED
          value: "true"
        - name: ORDERER_GENERAL_TLS_PRIVATEKEY
          value: /var/hyperledger/orderer/tls/keystore/key.pem
        - name: ORDERER_GENERAL_TLS_CERTIFICATE
          value: /var/hyperledger/orderer/tls/signcerts/cert.pem
        - name: ORDERER_GENERAL_TLS_ROOTCAS
          value: /var/hyperledger/orderer/tls/tlscacerts/raft-rootcas.pem

        - name: ORDERER_ADMIN_LISTENADDRESS
          value: "0.0.0.0:7053"
        - name: ORDERER_ADMIN_TLS_ENABLED
          value: "true"
        - name: ORDERER_ADMIN_TLS_PRIVATEKEY
          value: /var/hyperledger/orderer/tls/keystore/key.pem
        - name: ORDERER_ADMIN_TLS_CERTIFICATE
          value: /var/hyperledger/orderer/tls/signcerts/cert.pem
        - name: ORDERER_ADMIN_TLS_ROOTCAS
          value: /var/hyperledger/orderer/tls/tlscacerts/raft-rootcas.pem
        - name: ORDERER_ADMIN_TLS_CLIENTROOTCAS
          value: /var/hyperledger/orderer/tls/tlscacerts/tls-localhost-7052-tlsca-orgdcms.pem

        - name: ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE
          value: /var/hyperledger/orderer/tls/signcerts/cert.pem

        - name: ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY
          value: /var/hyperledger/orderer/tls/keystore/key.pem

        - name: ORDERER_GENERAL_CLUSTER_ROOTCAS
          value: /var/hyperledger/orderer/tls/tlscacerts/raft-rootcas.pem
        volumeMounts:
        - name: msp
          mountPath: /var/hyperledger/orderer/msp
        - name: tls
          mountPath: /var/hyperledger/orderer/tls
        - name: ledger
          mountPath: /var/hyperledger/orderer/production

      volumes:
      - name: msp
        persistentVolumeClaim:
          claimName: orderer2-msp-pvc
      - name: tls
        persistentVolumeClaim:
          claimName: orderer2-tls-pvc
      - name: ledger
        persistentVolumeClaim:
          claimName: orderer2-ledger-pvc
