# chaincode come servizio CCAAS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operationevent
  namespace: orgdcms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operationevent
  template:
    metadata:
      labels:
        app: operationevent
    spec:
      containers:
        - name: operationevent
          image: operationevent:1.0
          imagePullPolicy: Never
          #command:
          #  - fabric-chaincode-node
          args:
          #  - server
          #  - --
            - --chaincode-address
            - 0.0.0.0:9999
            - --chaincode-id
            - operationevent_1.0:bfd2a0ee91952307844ca1eb226c71edca0e666c31a034a866ca7ac5d2c9418a
          #env:
          #- name: CHAINCODE_SERVER_ADDRESS
          #  value: "0.0.0.0:9999"
          #- name: CHAINCODE_ID
          #  value: "basic_1.0:3681143caa30992f62a501431c28f7f93281faf9bf7997c816c263cfea28c04c"




          ports:
            - containerPort: 9999
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: operationevent
  namespace: orgdcms
spec:
  selector:
    app: operationevent
  ports:
    - port: 9999
      targetPort: 9999
