# deployment 24-02 con pvc
# PVC MSP peer1.orgdcms
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: peer1-orgdcms-msp-pvc
  namespace: orgdcms
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
# PVC TLS peer1.orgdcms
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: peer1-orgdcms-tls-pvc
  namespace: orgdcms
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
# PVC LEDGER peer1.orgdcms
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: peer1-orgdcms-ledger-pvc
  namespace: orgdcms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---

apiVersion: v1
kind: Service
metadata:
  name: peer1
  namespace: orgdcms
spec:
  clusterIP: None
  selector:
    app: peer1
  ports:
    - name: peer
      port: 7051
      targetPort: 7051
    - name: chaincode
      port: 7052
      targetPort: 7052
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peer1
  namespace: orgdcms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peer1
  template:
    metadata:
      labels:
        app: peer1
    spec:
      containers:
        - name: peer
          image: hyperledger/fabric-peer:2.5
          env:
            - name: CORE_PEER_ID
              value: peer1.orgdcms
            - name: CORE_PEER_ADDRESS
              value: peer1.orgdcms.svc.cluster.local:7051
            - name: CORE_PEER_LISTENADDRESS
              value: 0.0.0.0:7051
            - name: CORE_PEER_LOCALMSPID
              value: OrgDCMSMSP
            - name: CORE_PEER_CHAINCODELISTENADDRESS
              value: 0.0.0.0:7052
            - name: CORE_PEER_CHAINCODEADDRESS
              value: basicnode.orgdcms.svc.cluster.local:9999

            - name: CORE_PEER_MSPCONFIGPATH
              value: /var/hyperledger/peer/msp

            - name: CORE_PEER_TLS_ENABLED
              value: "true"
            - name: CORE_PEER_TLS_CERT_FILE
              value: /var/hyperledger/peer/tls/server.crt
            - name: CORE_PEER_TLS_KEY_FILE
              value: /var/hyperledger/peer/tls/server.key
            - name: CORE_PEER_TLS_ROOTCERT_FILE
              #value: /var/hyperledger/peer/tls/ca-bundle.crt
              value: /var/hyperledger/peer/tls/ca.crt
            - name: CORE_PEER_TLS_CLIENTROOTCAS_FILES
              #value: /var/hyperledger/peer/tls/ca-bundle.crt
              value: /var/hyperledger/peer/tls/ca.crt
              #/var/hyperledger/peer/tls/trusted/peer1-tls-ca.crt
            - name: CORE_PEER_GOSSIP_EXTERNALENDPOINT
              value: peer1.orgdcms.svc.cluster.local:7051
            - name: CORE_PEER_GOSSIP_USELEADERELECTION
              value: "true"
            - name: CORE_PEER_GOSSIP_ORGLEADER
              value: "false"
           # - name: CORE_CHAINCODE_EXTERNALBUILDERS
           #   value: '[{"name":"ccaas","path":"/opt/hyperledger/ccaas","propagateEnvironment":["CHAINCODE_SERVER_ADDRESS","CHAINCODE_ID"]}]'

          ports:
            - containerPort: 7051

          volumeMounts:
            - name: msp
              mountPath: /var/hyperledger/peer/msp
              readOnly: true
            - name: tls
              mountPath: /var/hyperledger/peer/tls
              readOnly: true
            - name: peer1-ledger
              mountPath: /var/hyperledger/production
            - mountPath: /opt/hyperledger/ccaas
              name: ccaas
      volumes:
        - name: msp
          persistentVolumeClaim:
            claimName: peer1-orgdcms-msp-pvc
        - name: tls
          persistentVolumeClaim:
            claimName: peer1-orgdcms-tls-pvc

        - name: peer1-ledger
          persistentVolumeClaim:
            claimName: peer1-orgdcms-ledger-pvc
        - name: ccaas
          hostPath:
            path: /opt/hyperledger/ccaas
            type: Directory
