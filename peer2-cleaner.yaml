# pod di accesso al PVC ledger di peer2
apiVersion: v1
kind: Pod
metadata:
  name: peer2-cleaner
  namespace: orgx
spec:
  restartPolicy: Never
  containers:
  - name: cleaner
    image: busybox
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: ledger
      mountPath: /var/hyperledger/production
  volumes:
  - name: ledger
    persistentVolumeClaim:
      claimName: peer2-orgx-ledger-pvc
