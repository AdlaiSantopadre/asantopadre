#popd di accesso al pvc msp di peer1
apiVersion: v1
kind: Pod
metadata:
  name: pvc-shell-peer1-msp
  namespace: orgdcms
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh","-lc","sleep 3600"]
      volumeMounts:
        - name: msp
          mountPath: /msp
  volumes:
    - name: msp
      persistentVolumeClaim:
        claimName: peer1-orgdcms-msp-pvc

