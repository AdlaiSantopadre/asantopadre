apiVersion: v1
kind: Pod
metadata:
  name: pvc-shell-peer2-msp
  namespace: orgx
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh","-lc","sleep 3600"]
      volumeMounts:
        - name: msp
          mountPath: /msp
  volumes:
    - name: msp
      persistentVolumeClaim:
        claimName: peer2-orgx-msp-pvc
