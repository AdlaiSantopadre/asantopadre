apiVersion: v1
kind: Pod
metadata:
  name: pvc-shell-peer2-tls
  namespace: orgx
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh","-lc","sleep 3600"]
      volumeMounts:
        - name: tls
          mountPath: /tls
  volumes:
    - name: tls
      persistentVolumeClaim:
        claimName: peer2-orgx-tls-pvc
